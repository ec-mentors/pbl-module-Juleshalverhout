# --- Application Info ---
spring.application.name=AdminProject

# --- Database Connection ---
# Essential properties for connecting to PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/admin_project_db
spring.datasource.username=postgres
spring.datasource.password=polkmn333

# --- JPA & Hibernate Settings ---
# This is a good explicit setting, but often optional as Spring Boot can infer it.
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Key setting for development: tells Hibernate to create/update tables automatically.
spring.jpa.hibernate.ddl-auto=update

# Very useful for debugging and learning: prints the SQL queries to the console.
spring.jpa.show-sql=true